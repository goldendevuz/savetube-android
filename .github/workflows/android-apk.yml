name: SaveTube Android APK

# Builds the signed SaveTube APKs (arm64-v8a, armeabi-v7a and a universal one). Started by hand (Actions -> Run workflow, or
# `gh workflow run android-apk.yml`). A newer build cancels the one in progress. The version code is the
# run number + 100, so every APK installs over the previous one; it is signed with the key kept in the
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets (the same key every time, or updates fail).
on:
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Signed APKs (arm64, 32-bit, universal)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Use CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleGithubRelease --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: savetube
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Check the signature
        run: |
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          apk=$(ls app/build/outputs/apk/github/release/*arm64-v8a*.apk | head -1)
          echo "APK: $apk"
          "$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest'

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: SaveTube-android-${{ github.run_number }}
          # arm64-v8a for most phones, armeabi-v7a for 32-bit phones and many TVs, universal for any device.
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
          retention-days: 14
